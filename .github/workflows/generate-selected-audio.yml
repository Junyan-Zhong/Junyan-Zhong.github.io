name: Generate Selected Writing audio

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "sunday-in-the-park-with-george.html"
      - "the-last-five-years.html"
      - "sentimental-value.html"
      - "scripts/generate_selected_audio.py"
      - ".github/workflows/generate-selected-audio.yml"

permissions:
  contents: write

jobs:
  narrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Generate narration
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 scripts/generate_selected_audio.py

      - name: Commit generated audio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sunday-in-the-park-with-george.mp3 the-last-five-years.mp3 sentimental-value.mp3
          if git diff --cached --quiet; then
            echo "No audio changes to commit."
          else
            git commit -m "Generate selected writing narration"
            git push
          fi
